apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
  - name: file-disc
    type: file-discovery
    parameters:
      path: /global/home/hpc6081/energy-epp/results/12302435/endpoints.yaml
      watchFile: true

  - name: kv-cache-scorer
    type: kv-cache-utilization-scorer

  - name: queue-scorer
    type: queue-scorer

  - name: max-score-picker
    type: max-score-picker

  - name: single-profile
    type: single-profile-handler

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: kv-cache-scorer
        weight: 1
      - pluginRef: queue-scorer
        weight: 1
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    endpoints:
      pluginRef: file-disc

# ─────────────────────────────────────────────────────────────────────
# CI Pipeline — Build, Test, and Validate
#
# Runs on pushes to main and pull requests into it. Tests the root Go code,
# builds and tests the llm-d-router plugin against its pinned release, checks
# that every copy of the router agrees on one version, and validates the
# Docker build.
#
# 2026-10-08: the E2E simulation step and the upstream-port check were
# removed. Both target code moved to legacy/ on 2026-10-03, and the project
# no longer presents simulated results. Go versions now come from go.mod
# instead of a hard-coded '1.25', which go.mod (go 1.26.0) had outgrown.
# ─────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ─── Go Build & Test ──────────────────────────────────────────────
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go mod download
        run: go mod download

      - name: Go vet
        run: go vet ./pkg/...

      - name: Run unit tests
        run: |
          go test -v -count=1 -race -coverprofile=coverage.out ./pkg/...
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go test -count=1 ./pkg/... 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  # ─── Build Verification ───────────────────────────────────────────
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          go build -o energy-epp ./cmd/energy-epp/
          echo "Binary size: $(du -h energy-epp | cut -f1)"

  # ─── Docker Image ─────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t energy-epp:ci-test .
          SIZE=$(docker image ls energy-epp:ci-test --format "{{.Size}}")
          echo "## 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "Image size: **$SIZE**" >> $GITHUB_STEP_SUMMARY

  # ─── Infrastructure Diagnostics Validation ──────────────────────────
  infra-validation:
    name: AI Infra Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bare-Metal Hardware & Network Validation
        run: |
          chmod +x scripts/baremetal_diagnostics.py
          python scripts/baremetal_diagnostics.py
          echo "## 🔧 Infrastructure Diagnostics Run" >> $GITHUB_STEP_SUMMARY
          echo "Validation of Linux systems, GPU infrastructure, and networking layers completed successfully." >> $GITHUB_STEP_SUMMARY

  # ─── llm-d-router plugin, against its pinned release ─────────────
  router-plugin:
    name: Router plugin (llm-d-router pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router-plugin/go.mod

      - name: Every copy of the router agrees on one version
        run: |
          git -C llm-d-ref fetch --quiet --tags origin
          SUB=$(git -C llm-d-ref describe --tags --exact-match 2>/dev/null || echo "untagged")
          MOD=$(grep -oE 'github.com/llm-d/llm-d-router v[^ ]+' router-plugin/go.mod | awk '{print $2}')
          echo "llm-d-ref submodule: $SUB"
          echo "router-plugin/go.mod: $MOD"
          {
            echo "## llm-d-router pin"
            echo "| Copy | Version |"; echo "|---|---|"
            echo "| \`llm-d-ref\` submodule | \`$SUB\` |"
            echo "| \`router-plugin/go.mod\` | \`$MOD\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUB" != "$MOD" ]; then
            echo "Submodule and go.mod pin different router versions; results tie to one version." >&2
            exit 1
          fi

      - name: Build, vet and test
        working-directory: router-plugin
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: EPP binary builds reproducibly
        run: |
          bash router-plugin/build.sh
          A=$(cut -d' ' -f1 router-plugin/bin/epp-linux-amd64.sha256)
          bash router-plugin/build.sh
          B=$(cut -d' ' -f1 router-plugin/bin/epp-linux-amd64.sha256)
          echo "build 1: $A"; echo "build 2: $B"
          echo "EPP sha256: \`$A\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$A" = "$B" ] || { echo "Two builds differ; the provenance hash cannot be trusted." >&2; exit 1; }

  # ─── Diagrams (optional) ──────────────────────────────────────────
  diagrams:
    name: Generate Diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate diagrams
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python benchmarks/scripts/generate_advanced_diagrams.py
          echo "Diagrams generated successfully"

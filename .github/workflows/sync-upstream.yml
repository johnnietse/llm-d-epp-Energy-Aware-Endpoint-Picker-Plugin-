# ─────────────────────────────────────────────────────────────────────
# Watch llm-d-router for new RELEASES and propose a pin bump
#
# What changed and why (2026-10-08). This workflow used to fast-forward the
# llm-d-ref submodule to upstream `main` every day and push the result
# straight to our `main`. That is wrong for a measurement project:
#
#   * The router is pinned to a release (v0.11.0) in three places that must
#     agree: this submodule, router-plugin/go.mod, and the clone on the
#     cluster. Results, configs extracted from the docs, and the EPP binary
#     are all tied to that one version. A daily move to `main` silently broke
#     the agreement; it had drifted the submodule to a different commit than
#     the build used.
#   * `main` moves daily and its docs already disagree with the release
#     (`--pool-name` is optional on main, required at v0.11.0).
#
# It now follows release tags only, never changes `main` itself, and opens
# a pull request that bumps the submodule and router-plugin/go.mod TOGETHER,
# after building and testing the plugin against the new release. Moving the
# pin stays a human decision, because it obliges a rebuild, a smoke test on
# the cluster, and re-pinning the cluster clone; the PR lists those steps.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so
# CI will not run on them by itself. That is why this job builds and tests
# the plugin itself and reports the result in the PR body.
#
# Repository setting required once: Settings -> Actions -> General ->
# Workflow permissions -> "Allow GitHub Actions to create and approve pull
# requests".
# ─────────────────────────────────────────────────────────────────────
name: Watch llm-d-router releases

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC; releases are weeks apart
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM: https://github.com/llm-d/llm-d-router.git
  GOTOOLCHAIN: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Compare the pinned release with the latest upstream release
        id: cmp
        run: |
          # Latest stable release tag: vX.Y.Z only, release candidates excluded.
          LATEST=$(git ls-remote --tags --refs "$UPSTREAM" 'v*' \
                   | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -V | tail -1)
          git -C llm-d-ref fetch --quiet --tags origin
          PINNED=$(git -C llm-d-ref describe --tags --exact-match 2>/dev/null || echo "untagged")
          GOMOD=$(grep -oE 'github.com/llm-d/llm-d-router v[^ ]+' router-plugin/go.mod | awk '{print $2}')
          echo "latest upstream release: $LATEST"
          echo "submodule pinned at:     $PINNED"
          echo "router-plugin/go.mod:    $GOMOD"
          {
            echo "latest=$LATEST"
            echo "pinned=$PINNED"
            echo "gomod=$GOMOD"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## llm-d-router release check"
            echo ""
            echo "| | Version |"
            echo "|---|---|"
            echo "| Latest upstream release | \`$LATEST\` |"
            echo "| Submodule \`llm-d-ref\` | \`$PINNED\` |"
            echo "| \`router-plugin/go.mod\` | \`$GOMOD\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PINNED" != "$GOMOD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**The two pins disagree.** Fix this before anything else; results tie to one version." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$LATEST" ]; then
            echo "Could not list upstream release tags." >&2
            exit 1
          fi
          if [ "$LATEST" = "$PINNED" ] && [ "$LATEST" = "$GOMOD" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Up to date. Nothing to propose." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a pull request for this release already exists
        id: existing
        if: steps.cmp.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="upstream/llm-d-router-${{ steps.cmp.outputs.latest }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          N=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$N" != "0" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "A pull request for $BRANCH is already open; not opening another." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.cmp.outputs.bump == 'true' && steps.existing.outputs.open == 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: router-plugin/go.mod

      - name: Bump submodule and router-plugin together, then build and test
        id: bump
        if: steps.cmp.outputs.bump == 'true' && steps.existing.outputs.open == 'false'
        run: |
          TAG="${{ steps.cmp.outputs.latest }}"
          git -C llm-d-ref -c advice.detachedHead=false checkout --quiet "$TAG"
          cd router-plugin
          go get "github.com/llm-d/llm-d-router@$TAG"
          go mod tidy
          # The checks that matter for us, against the NEW release: the plugin
          # still compiles against the router's interfaces and its tests pass.
          set +e
          go build ./... > ../build.log 2>&1;  B=$?
          go vet ./...   > ../vet.log 2>&1;    V=$?
          go test ./...  > ../test.log 2>&1;   T=$?
          set -e
          cd ..
          # Interface landmarks the plugin depends on, by their real locations
          # at v0.11.0 (the old workflow looked for a scorer.go that does not
          # exist).
          # grep -c prints 0 AND exits non-zero on no match, so "|| echo 0" would
          # yield "0" twice; capture, then default an empty result (missing file).
          L1=$(grep -c 'type Scorer interface' llm-d-ref/pkg/epp/framework/interface/scheduling/plugins.go 2>/dev/null); L1=${L1:-0}
          L2=$(grep -c '^func Register(' llm-d-ref/pkg/epp/framework/interface/plugin/registry.go 2>/dev/null); L2=${L2:-0}
          L3=$(grep -c 'file discovery (no Kubernetes)' llm-d-ref/docs/discovery.md 2>/dev/null); L3=${L3:-0}
          {
            echo "build=$B"; echo "vet=$V"; echo "test=$T"
            echo "l_scorer=$L1"; echo "l_register=$L2"; echo "l_filedisc=$L3"
          } >> "$GITHUB_OUTPUT"

      - name: Push branch and open pull request
        if: steps.cmp.outputs.bump == 'true' && steps.existing.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.cmp.outputs.latest }}"
          OLD="${{ steps.cmp.outputs.pinned }}"
          BRANCH="${{ steps.existing.outputs.branch }}"
          ok() { [ "$1" = "0" ] && echo "pass" || echo "**FAIL**"; }
          has() { [ "$1" -ge 1 ] 2>/dev/null && echo "present" || echo "**MISSING**"; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add llm-d-ref router-plugin/go.mod router-plugin/go.sum
          git commit -m "Propose llm-d-router $OLD -> $TAG (submodule and router-plugin together)"
          git push --force origin "$BRANCH"
          cat > body.md <<EOF
          Upstream released **$TAG**. This moves both pins together, from \`$OLD\`:
          the \`llm-d-ref\` submodule and \`router-plugin/go.mod\`.

          ### Checks run by this workflow against $TAG
          | Check | Result |
          |---|---|
          | \`go build ./...\` in router-plugin | $(ok "${{ steps.bump.outputs.build }}") |
          | \`go vet ./...\` | $(ok "${{ steps.bump.outputs.vet }}") |
          | \`go test ./...\` | $(ok "${{ steps.bump.outputs.test }}") |
          | \`type Scorer interface\` in \`scheduling/plugins.go\` | $(has "${{ steps.bump.outputs.l_scorer }}") |
          | \`func Register(\` in \`plugin/registry.go\` | $(has "${{ steps.bump.outputs.l_register }}") |
          | File-discovery (no Kubernetes) section in \`docs/discovery.md\` | $(has "${{ steps.bump.outputs.l_filedisc }}") |

          CI does not run on pull requests opened by GitHub Actions, so these
          are the only automated checks.

          ### Before merging, by hand
          - [ ] Read upstream release notes ($OLD to $TAG) for EPP flag or config changes. The file-discovery flags we depend on are listed in \`router-plugin/README.md\`.
          - [ ] Rebuild with \`bash router-plugin/build.sh\` and record the new sha256 in \`router-plugin/README.md\`.
          - [ ] Re-pin the cluster clone: \`bash fr-sync.sh run router_pin.sh $TAG\`.
          - [ ] Update the version checks in \`router_smoke.sbatch\`, \`router_overhead.sbatch\` and \`verify_fixes.sh\`, which assert v0.11.0.
          - [ ] Rerun the router smoke test and require \`VERDICT=PASS\`.
          - [ ] Do **not** mix results across router versions. Anything measured before this merge stays attributed to \`$OLD\`.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "Propose llm-d-router $TAG (from $OLD)" --body-file body.md
          echo "Opened a pull request for $TAG." >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────
# Watch llm-d-router for new RELEASES and propose a pin bump
#
# Why it follows releases (2026-10-08). This workflow used to fast-forward
# the llm-d-ref submodule to upstream `main` daily and push straight to our
# `main`. The router is pinned to a release (v0.11.0) in three places that
# must agree - this submodule, router-plugin/go.mod, and the clone on the
# cluster - and results, extracted configs and the EPP binary all tie to that
# one version. It now follows release tags only and opens a pull request that
# moves both in-repo pins together. It never pushes to `main`.
#
# Security design (2026-10-08, after two automated reviews):
#
#   evaluate  Runs upstream code: `go test` links llm-d-router packages and
#             executes their init(). So: read-only token, checkout with
#             persist-credentials: false, no token in any environment, and the
#             Go cache DISABLED, so nothing it leaves behind is saved for later
#             CI runs to restore (cache poisoning). Its only output is a small
#             text file of integers and two sha256 hashes.
#   propose   The only job with write permission. Runs no build, test or vet,
#             so no module code executes. It regenerates go.mod and go.sum
#             itself with `go get` and `go mod tidy` (which download and
#             resolve modules, checked against the Go checksum database, but do
#             not run them) and refuses to continue unless their hashes match
#             the ones `evaluate` tested. Nothing produced by the untrusted job
#             is ever committed; only validated integers and hashes cross over.
#
# All actions are pinned to full commit SHAs (resolved 2026-10-08 from the
# tags shown in the trailing comments). Untrusted values (tag names) reach the
# shell only through `env:` and are validated before use; no run block
# contains ${{ }}.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so CI
# does not run on them; the evaluate job's results are the automated checks.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" is OFF (checked 2026-10-08) and may stay off: if PR creation is
# refused, the propose job opens an issue linking the pushed branch instead.
# ─────────────────────────────────────────────────────────────────────
name: Watch llm-d-router releases

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC; releases are weeks apart
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM: https://github.com/llm-d/llm-d-router.git
  GOTOOLCHAIN: auto

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.cmp.outputs.bump }}
      latest: ${{ steps.cmp.outputs.latest }}
      pinned: ${{ steps.cmp.outputs.pinned }}
    steps:
      - name: Checkout (no credentials left on disk)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Compare the pinned release with the latest upstream release
        id: cmp
        run: |
          set -eu
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          LATEST=$(git ls-remote --tags --refs "$UPSTREAM" 'v*' \
                   | sed 's#.*refs/tags/##' | grep -E "$semver" | sort -V | tail -1 || true)
          git -C llm-d-ref fetch --quiet --tags origin
          PINNED=$(git -C llm-d-ref describe --tags --exact-match 2>/dev/null || echo untagged)
          GOMOD=$(grep -oE 'github.com/llm-d/llm-d-router v[^ ]+' router-plugin/go.mod | awk '{print $2}')
          echo "latest upstream release: $LATEST"
          echo "submodule pinned at:     $PINNED"
          echo "router-plugin/go.mod:    $GOMOD"
          printf '%s' "$LATEST" | grep -Eq "$semver" || { echo "no valid upstream release tag" >&2; exit 1; }
          printf '%s' "$PINNED" | grep -Eq "$semver" || PINNED=untagged
          printf '%s' "$GOMOD"  | grep -Eq "$semver" || GOMOD=invalid
          { echo "latest=$LATEST"; echo "pinned=$PINNED"; } >> "$GITHUB_OUTPUT"
          {
            echo "## llm-d-router release check"
            echo ""
            echo "| | Version |"
            echo "|---|---|"
            echo "| Latest upstream release | $LATEST |"
            echo "| Submodule llm-d-ref | $PINNED |"
            echo "| router-plugin/go.mod | $GOMOD |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PINNED" != "$GOMOD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**The two pins disagree.** Results tie to one version; fix this first." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$LATEST" = "$PINNED" ] && [ "$LATEST" = "$GOMOD" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Up to date. Nothing to propose." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go (cache disabled - this job runs upstream code)
        if: steps.cmp.outputs.bump == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: router-plugin/go.mod
          cache: false

      - name: Bump both pins, then build, vet and test against the new release
        if: steps.cmp.outputs.bump == 'true'
        env:
          TAG: ${{ steps.cmp.outputs.latest }}
        run: |
          set -u
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad tag" >&2; exit 1; }
          git -C llm-d-ref -c advice.detachedHead=false checkout --quiet "$TAG"
          cd router-plugin
          go get "github.com/llm-d/llm-d-router@$TAG" || exit 1
          go mod tidy || exit 1
          # Hash go.mod/go.sum BEFORE any module code runs, so the hashes
          # describe what was resolved, not what tests might have touched.
          MODSUM=$(sha256sum go.mod | cut -d' ' -f1)
          SUMSUM=$(sha256sum go.sum | cut -d' ' -f1)
          go build ./... > ../build.log 2>&1; B=$?
          go vet ./...   > ../vet.log 2>&1;   V=$?
          go test ./...  > ../test.log 2>&1;  T=$?
          cd ..
          # grep -c prints 0 AND exits non-zero on no match, so "|| echo 0"
          # would yield "0" twice; capture, then default an empty result.
          L1=$(grep -c 'type Scorer interface' llm-d-ref/pkg/epp/framework/interface/scheduling/plugins.go 2>/dev/null); L1=${L1:-0}
          L2=$(grep -c '^func Register(' llm-d-ref/pkg/epp/framework/interface/plugin/registry.go 2>/dev/null); L2=${L2:-0}
          L3=$(grep -c 'file discovery (no Kubernetes)' llm-d-ref/docs/discovery.md 2>/dev/null); L3=${L3:-0}
          mkdir -p handoff
          printf 'build=%s\nvet=%s\ntest=%s\nl_scorer=%s\nl_register=%s\nl_filedisc=%s\nmodsum=%s\nsumsum=%s\n' \
                 "$B" "$V" "$T" "$L1" "$L2" "$L3" "$MODSUM" "$SUMSUM" > handoff/results.txt
          cat handoff/results.txt
          echo "Build, vet and test log tails are printed below for review in this run's log."
          tail -40 build.log vet.log test.log 2>&1 || true

      - name: Hand results to the propose job
        if: steps.cmp.outputs.bump == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-d-router-bump
          path: handoff/results.txt
          retention-days: 7

  propose:
    needs: evaluate
    if: needs.evaluate.outputs.bump == 'true'
    runs-on: ubuntu-latest
    # The only job with write access. It runs git, gh, `go get` and
    # `go mod tidy` - never build, test or vet - so no module code executes.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      TAG: ${{ needs.evaluate.outputs.latest }}
      OLD: ${{ needs.evaluate.outputs.pinned }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate inputs from the evaluate job
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad TAG" >&2; exit 1; }
          printf '%s' "$OLD" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+|untagged)$' || { echo "bad OLD" >&2; exit 1; }

      - name: Skip if a pull request for this release is already open
        id: existing
        run: |
          set -eu
          BRANCH="upstream/llm-d-router-$TAG"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # Count only pull requests this workflow could have opened: authored
          # by the Actions bot and from this repository, not a fork. Anyone can
          # open a fork PR whose branch has the same name, and counting it would
          # let them silently suppress the real proposal (fail-open dedup).
          N=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                --json number,author,isCrossRepository \
                --jq '[.[] | select(.isCrossRepository == false and .author.login == "app/github-actions")] | length')
          if [ "$N" != "0" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "A pull request for $BRANCH is already open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.existing.outputs.open == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch the evaluate job's results (integers and hashes only)
        if: steps.existing.outputs.open == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llm-d-router-bump
          path: handoff

      - name: Set up Go (cache disabled)
        if: steps.existing.outputs.open == 'false'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: router-plugin/go.mod
          cache: false

      - name: Regenerate the pins here, require they match what was tested
        if: steps.existing.outputs.open == 'false'
        run: |
          set -eu
          # Every value read from the artifact is validated by shape; the file
          # itself is never sourced, executed or committed.
          getn() { v=$(sed -n "s/^$1=//p" handoff/results.txt | head -1)
                   printf '%s' "$v" | grep -Eq '^[0-9]+$' || { echo "bad $1" >&2; exit 1; }
                   printf '%s' "$v"; }
          geth() { v=$(sed -n "s/^$1=//p" handoff/results.txt | head -1)
                   printf '%s' "$v" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad $1" >&2; exit 1; }
                   printf '%s' "$v"; }
          MODSUM_T=$(geth modsum); SUMSUM_T=$(geth sumsum)
          git -C llm-d-ref fetch --quiet --tags origin
          git -C llm-d-ref -c advice.detachedHead=false checkout --quiet "$TAG"
          cd router-plugin
          go get "github.com/llm-d/llm-d-router@$TAG"
          go mod tidy
          MODSUM=$(sha256sum go.mod | cut -d' ' -f1)
          SUMSUM=$(sha256sum go.sum | cut -d' ' -f1)
          if [ "$MODSUM" != "$MODSUM_T" ] || [ "$SUMSUM" != "$SUMSUM_T" ]; then
            echo "Regenerated go.mod/go.sum differ from what the evaluate job tested; refusing to propose untested pins." >&2
            exit 1
          fi
          echo "go.mod and go.sum regenerated here match the tested ones byte for byte."

      - name: Commit, push the branch, open the pull request
        if: steps.existing.outputs.open == 'false'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -eu
          getn() { v=$(sed -n "s/^$1=//p" handoff/results.txt | head -1)
                   printf '%s' "$v" | grep -Eq '^[0-9]+$' || { echo "bad $1" >&2; exit 1; }
                   printf '%s' "$v"; }
          B=$(getn build); V=$(getn vet); T=$(getn test)
          L1=$(getn l_scorer); L2=$(getn l_register); L3=$(getn l_filedisc)
          ok()  { [ "$1" = "0" ] && echo "pass" || echo "**FAIL**"; }
          has() { [ "$1" -ge 1 ] && echo "present" || echo "**MISSING**"; }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add llm-d-ref router-plugin/go.mod router-plugin/go.sum
          git commit -m "Propose llm-d-router $OLD -> $TAG (submodule and router-plugin together)"
          git push --force origin "$BRANCH"

          {
            echo "Upstream released **$TAG**. This moves both pins together from \`$OLD\`: the \`llm-d-ref\` submodule and \`router-plugin/go.mod\`."
            echo ""
            echo "### Checks against $TAG (run in a read-only job)"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| \`go build ./...\` in router-plugin | $(ok "$B") |"
            echo "| \`go vet ./...\` | $(ok "$V") |"
            echo "| \`go test ./...\` | $(ok "$T") |"
            echo "| \`type Scorer interface\` in \`scheduling/plugins.go\` | $(has "$L1") |"
            echo "| \`func Register(\` in \`plugin/registry.go\` | $(has "$L2") |"
            echo "| File-discovery (no Kubernetes) section in \`docs/discovery.md\` | $(has "$L3") |"
            echo ""
            echo "go.mod and go.sum in this PR were regenerated in the write job and match, byte for byte, the ones the read-only job built and tested. CI does not run on pull requests opened by GitHub Actions; these are the only automated checks. Log tails are in the evaluate job's run log."
            echo ""
            echo "### Before merging, by hand"
            echo "- [ ] Read upstream release notes ($OLD to $TAG) for EPP flag or config changes. The file-discovery flags we depend on are listed in \`router-plugin/README.md\`."
            echo "- [ ] Rebuild with \`bash router-plugin/build.sh\` and record the new sha256 in \`router-plugin/README.md\`."
            echo "- [ ] Re-pin the cluster clone: \`bash fr-sync.sh run router_pin.sh $TAG\`."
            echo "- [ ] Update the v0.11.0 assertions in \`router_smoke.sbatch\`, \`router_overhead.sbatch\` and \`verify_fixes.sh\`."
            echo "- [ ] Rerun the router smoke test and require \`VERDICT=PASS\`."
            echo "- [ ] Do **not** mix results across router versions. Anything measured before this merge stays attributed to \`$OLD\`."
          } > body.md
          # The repository setting "Allow GitHub Actions to create and approve
          # pull requests" was OFF when this was written (checked 2026-10-08),
          # and is a security setting best left off. When PR creation is
          # refused, open an issue linking the pushed branch instead; issue
          # creation is not governed by that setting.
          if gh pr create --base main --head "$BRANCH" \
               --title "Propose llm-d-router $TAG (from $OLD)" --body-file body.md; then
            echo "Opened a pull request for $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Branch \`$BRANCH\` is pushed and ready, but a pull request could not be opened automatically (the repository setting that allows GitHub Actions to create pull requests is off). Open one from that branch by hand."
              echo ""
              cat body.md
            } > issue.md
            # Count only issues the Actions bot opened with exactly this title.
            # Anyone can open an issue, and a fuzzy title search over all of
            # them would let an outsider suppress the notice by filing a
            # look-alike first (fail-open dedup).
            TITLE="Propose llm-d-router $TAG (from $OLD)"
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
                         --json title,author \
                         --jq '.[] | select(.author.login == "app/github-actions") | .title' \
                       | grep -Fxc -- "$TITLE" || true)
            if [ "${EXISTING:-0}" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Propose llm-d-router $TAG (from $OLD)" --body-file issue.md
              echo "PR creation refused; opened an issue for $TAG instead." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR creation refused; an issue for $TAG is already open." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
